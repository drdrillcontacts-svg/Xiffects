name: Android real-audio debug candidate
on:
  push:
    paths: ['.github/workflows/mobile-android.yml', 'Platforms/Android/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Projucer build dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libx11-dev libxext-dev libxinerama-dev libxrandr-dev libxcursor-dev libfreetype6-dev libfontconfig1-dev libgl1-mesa-dev
      - name: Generate native Android audio application
        run: |
          git clone --depth 1 --branch 8.0.6 https://github.com/juce-framework/JUCE.git build-juce
          cmake -S build-juce -B build-projucer -DJUCE_BUILD_EXTRAS=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build-projucer --target Projucer --parallel 3
          build-projucer/extras/Projucer/Projucer_artefacts/Release/Projucer --resave Platforms/Android/Xiffects.jucer
          echo "sdk.dir=$ANDROID_HOME" > build-android/local.properties
      - name: Build ARM64 debug APK
        working-directory: build-android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Xiffects-Android-arm64-debug-UNTESTED-ON-DEVICE
          path: build-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
