name: Build Xiffects
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  dsp-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DXIFFECTS_DSP_ONLY=ON -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build VST3 and Standalone
        run: cmake --build build --config Release --parallel 2
      - name: DSP tests
        run: ctest --test-dir build -C Release --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: Xiffects-Windows-x64
          path: |
            build/Xiffects_artefacts/Release/VST3/
            build/Xiffects_artefacts/Release/Standalone/
          if-no-files-found: error
