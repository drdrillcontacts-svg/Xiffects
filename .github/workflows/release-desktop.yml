name: Desktop factory bank candidate
on:
  push:
    paths: ['Source/**', 'Assets/**', 'Tests/**', 'CMakeLists.txt', '.github/workflows/release-desktop.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build-release -DCMAKE_BUILD_TYPE=Release -DXIFFECTS_BUILD_LIVE=ON
      - name: Build
        run: cmake --build build-release --config Release --parallel 3
      - name: Product and factory tests
        run: ctest --test-dir build-release -C Release --output-on-failure --output-junit tests.xml
      - name: Package macOS bundles without losing symlinks
        if: runner.os == 'macOS'
        run: |
          mkdir -p package
          ditto -c -k --sequesterRsrc --keepParent build-release/XiffectsLive_artefacts/Release package/Xiffects-Live-macOS-arm64-unsigned.zip
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS' && success()
        with:
          name: Xiffects-Live-macOS-arm64-unsigned
          path: package/*.zip
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows' && success()
        with:
          name: Xiffects-Live-Windows-x64-50-presets
          path: |
            build-release/XiffectsLive_artefacts/Release/VST3/
            build-release/XiffectsLive_artefacts/Release/Standalone/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Tests-${{ matrix.os }}
          path: |
            build-release/tests.xml
            build-release/Testing/Temporary/
